apply plugin: 'jacoco'

dependencies {
    api project(':citydb-io')
    implementation project(':citydb-config')
    implementation project(':citydb-core')
    implementation project(':citydb-model')
    implementation project(':citydb-database')
    implementation 'org.citydb:texture-atlas-creator:1.5.0'

    testImplementation project(':citydb-query')
    testImplementation project(':citydb-operation')
    testRuntimeOnly project(':citydb-database-postgres')
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.18'
}

def itCredentials = [
        CITYDB_TEST_PASSWORD: 'citydb.test.password',
        CITYDB_TEST_HOST    : 'citydb.test.host',
        CITYDB_TEST_PORT    : 'citydb.test.port',
        CITYDB_TEST_DATABASE: 'citydb.test.database',
        CITYDB_TEST_USER    : 'citydb.test.user',
        CITYDB_TEST_SCHEMA  : 'citydb.test.schema',
        CESIUM_ION_TOKEN    : 'cesium.ionToken',
].collectEntries { envName, propertyName ->
    def value = System.getenv(envName) ?: findProperty(propertyName)
    value?.toString()?.trim() ? [(envName): value.toString().trim()] : [:]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    environment itCredentials

    // The railway export IT builds texture atlases concurrently and
    // the default 512m is not sufficient. 2g also fails; 4g passes.
    maxHeapSize = '4g'

    jacoco {
        includes = ['org.citydb.vis.*']
    }
}

test {
    filter {
        if (!itCredentials.CITYDB_TEST_PASSWORD) {
            excludeTestsMatching '*RailwayScene*IT'
        }
        if (!itCredentials.CESIUM_ION_TOKEN) {
            excludeTestsMatching '*CesiumWorldTerrainProviderIT'
        }
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.register('integrationTest', Test) {
    description = 'Runs the live-database and network integration tests (requires a local citydb).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*IT'
    }
}

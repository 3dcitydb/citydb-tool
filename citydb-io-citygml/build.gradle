def citygml4jVersion = '3.5.2'

dependencies {
    api "org.citygml4j:citygml4j-xml:$citygml4jVersion"
    api "org.citygml4j:citygml4j-cityjson:$citygml4jVersion"
    implementation project(':citydb-io')
    runtimeOnly 'com.fasterxml.woodstox:woodstox-core:7.3.0'
    runtimeOnly 'net.sf.saxon:Saxon-HE:13.1'
    annotationProcessor "org.citygml4j:citygml4j-xml:$citygml4jVersion"
}